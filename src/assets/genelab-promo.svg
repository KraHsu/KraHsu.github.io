<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">GeneLab</title>
  <desc id="desc">A flat editorial project graphic for GeneLab, an open-source robotics research toolkit.</desc>
  <rect width="1200" height="720" fill="#f7f5ff"/>
